<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LMA Chat – Rencontres Afrique & Europe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#faf7ff;--card:#fff;--tx:#1d1433;--mut:#6b6285;--ac:#7b2ff7;--ac2:#f107a3;--bd:#e5dcf5}
@media (prefers-color-scheme:dark){:root{--bg:#140d24;--card:#21163a;--tx:#f4efff;--mut:#b3a6d4;--ac:#a66bff;--ac2:#ff4fb8;--bd:#3a2c5c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.w{max-width:480px;margin:0 auto;padding:20px 18px 40px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.3rem;color:var(--ac)}
.lang button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:99px;font-size:.85rem;cursor:pointer}
.lang button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
h1{font-size:1.9rem;line-height:1.15;margin:26px 0 8px}
p.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.go{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer}
button.go:disabled{opacity:.6}
button.out{margin-top:16px;padding:10px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;cursor:pointer}
.msg{margin-top:12px;font-size:.95rem}
.ok{color:#2e8b57}.er{color:#d33}
.hide{display:none}
textarea{resize:vertical;font-family:inherit}
.m{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:10px}.m b{display:block}.m span{color:var(--mut);font-size:.9rem}.m p{margin:6px 0 0;overflow-wrap:anywhere}
#thread{display:flex;flex-direction:column;max-height:50vh;overflow-y:auto;margin:10px 0}
.bub{max-width:85%;padding:10px 12px;border-radius:14px;margin:5px 0;overflow-wrap:anywhere;white-space:pre-wrap}
.mine{align-self:flex-end;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff}
.theirs{align-self:flex-start;background:var(--card);border:1px solid var(--bd)}
.rule{font-size:.85rem;color:var(--mut);margin:6px 0 0}
h2{font-size:1.2rem;margin:14px 0 4px}
footer{margin-top:26px;color:var(--mut);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<div class="w">
  <div class="top">
    <div class="logo"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b2ff7"/><stop offset="1" stop-color="#f107a3"/></linearGradient></defs><path d="M16 3C8.8 3 3 8 3 14.2c0 3.5 1.9 6.6 4.9 8.6L7 29l6-3.2c1 .2 2 .3 3 .3 7.2 0 13-5 13-11.2S23.2 3 16 3z" fill="url(#g)"/><path d="M16 20.5l-4.6-4.5a3.2 3.2 0 014.6-4.5 3.2 3.2 0 014.6 4.5z" fill="#fff"/></svg>LMA Chat</div>
    <div class="lang"><button id="bfr" onclick="setL('fr')">FR</button> <button id="ben" onclick="setL('en')">EN</button></div>
  </div>

  <div id="viewAuth">
    <h1 id="t1"></h1>
    <p class="sub" id="t2"></p>
    <div class="card">
      <div class="tabs"><button id="tabUp" onclick="setTab('up')"></button><button id="tabIn" onclick="setTab('in')"></button></div>
      <div id="fName"><label id="lName" for="name"></label><input id="name" autocomplete="nickname" maxlength="40"></div>
      <label id="lEmail" for="email"></label><input id="email" type="email" inputmode="email" autocomplete="email">
      <label id="lPass" for="pass"></label><input id="pass" type="password" autocomplete="current-password" minlength="8">
      <div id="fUp">
        <label id="lBirth" for="birth"></label><input id="birth" type="date">
        <label id="lCountry" for="country"></label><select id="country"></select>
      </div>
      <button class="go" id="send" onclick="submitF()"></button>
      <div class="msg" id="msg" role="status"></div>
    </div>
  </div>

  <div id="viewHome" class="hide">
    <h1 id="hello"></h1>
    <p class="sub" id="hsub"></p>
    <div class="tabs"><button id="tabMem" onclick="setHome('mem')"></button><button id="tabMsg" onclick="setHome('msg')"></button><button id="tabMe" onclick="setHome('me')"></button></div>
    <div id="secMe" class="card hide">
      <label id="pName" for="pn"></label><input id="pn" maxlength="40">
      <label id="pAge" for="pa"></label><input id="pa" type="number" inputmode="numeric" min="18" max="99">
      <label id="pCity" for="pc"></label><input id="pc" maxlength="60">
      <label id="pCountry" for="pco"></label><select id="pco"></select>
      <label id="pBio" for="pb"></label><textarea id="pb" maxlength="300" rows="4"></textarea>
      <button class="go" id="pSave" onclick="saveP()"></button>
      <div class="msg" id="pmsg" role="status"></div>
    </div>
    <div id="secMem"><div id="list"></div></div>
    <div id="secMsg" class="hide">
      <div id="convs"></div>
      <div id="chat" class="hide">
        <button class="out" id="back" onclick="closeChat()"></button>
        <h2 id="chatName"></h2>
        <p class="rule" id="rule"></p>
        <div id="thread"></div>
        <textarea id="mb" maxlength="1000" rows="2"></textarea>
        <button class="go" id="mSend" onclick="sendM()"></button>
        <div class="msg" id="mmsg" role="status"></div>
      </div>
    </div>
    <button class="out" id="logout" onclick="logout()"></button>
  </div>

  <footer id="foot"></footer>
</div>

<script>
var SB_URL='https://ndwldtmkhxlgvvpeiuui.supabase.co';
var SB_KEY='sb_publishable_IxOMKArEFDsrbDEbZwRRYA_rtv0CZ3Q';
var sb=supabase.createClient(SB_URL,SB_KEY);
var homeTab='mem',prof=null,members=[],lastId=null,chatWith=null,convs=[],thread=[],chan=null;
var L=(navigator.language||'fr').slice(0,2)==='en'?'en':'fr',tab='up',user=null;
var C=['Sénégal','Côte d’Ivoire','Cameroun','Mali','Guinée','Bénin','Togo','Burkina Faso','RD Congo','Congo','Gabon','Maroc','Algérie','Tunisie','Nigeria','Ghana','Kenya','France','Belgique','Suisse','Royaume-Uni','Allemagne','Canada','Autre'];
var CE=['Senegal','Ivory Coast','Cameroon','Mali','Guinea','Benin','Togo','Burkina Faso','DR Congo','Congo','Gabon','Morocco','Algeria','Tunisia','Nigeria','Ghana','Kenya','France','Belgium','Switzerland','United Kingdom','Germany','Canada','Other'];
var T={
fr:{t1:'Rejoignez LMA Chat',t2:'Une communauté de rencontres sérieuse et sécurisée, d’Afrique à l’Europe.',up:'Créer un compte',inn:'Se connecter',
name:'Prénom ou pseudo',email:'Adresse e-mail',pass:'Mot de passe (8 caractères minimum)',birth:'Date de naissance',country:'Pays',
sendUp:'Créer mon compte',sendIn:'Me connecter',
young:'Vous devez avoir 18 ans ou plus.',fill:'Remplissez tous les champs. Le mot de passe doit avoir 8 caractères minimum.',
check:'Compte créé. Ouvrez votre boîte mail et appuyez sur le lien de confirmation, puis connectez-vous.',
badLogin:'E-mail ou mot de passe incorrect, ou e-mail non confirmé.',err:'Une erreur est survenue. Réessayez dans un instant.',
hello:'Bienvenue',complete:'Complétez votre profil pour découvrir les membres.',tMem:'Membres',tMe:'Mon profil',pName:'Prénom ou pseudo',pAge:'Âge',pCity:'Ville',pCountry:'Pays',pBio:'Présentation (300 caractères maximum)',pSave:'Enregistrer mon profil',psaved:'Profil enregistré.',pfill:'Indiquez un prénom et un âge entre 18 et 99.',none:'Aucun autre membre pour l’instant. Vous êtes parmi les premiers.',yrs:'ans',tMsg:'Messages',write:'Écrire',open:'Ouvrir',back:'Retour',mSend:'Envoyer',ph:'Votre message…',you:'Vous',noConv:'Aucune conversation. Écrivez à un membre depuis l’onglet Membres.',rule:'Pour votre sécurité : ne partagez jamais de numéro, de carte bancaire ni d’argent.',blocked:'Message refusé : il est interdit de partager des numéros de téléphone, des liens, des réseaux sociaux (WhatsApp, etc.) ou des informations bancaires.',out:'Se déconnecter',
foot:'Réservé aux adultes (18+). Vos données restent confidentielles.'},
en:{t1:'Join LMA Chat',t2:'A serious, secure dating community from Africa to Europe.',up:'Create account',inn:'Log in',
name:'First name or nickname',email:'Email address',pass:'Password (8 characters minimum)',birth:'Date of birth',country:'Country',
sendUp:'Create my account',sendIn:'Log in',
young:'You must be 18 or older.',fill:'Fill in all fields. The password needs at least 8 characters.',
check:'Account created. Open your inbox, tap the confirmation link, then log in.',
badLogin:'Wrong email or password, or email not confirmed.',err:'Something went wrong. Please try again shortly.',
hello:'Welcome',complete:'Complete your profile to discover members.',tMem:'Members',tMe:'My profile',pName:'First name or nickname',pAge:'Age',pCity:'City',pCountry:'Country',pBio:'About you (300 characters max)',pSave:'Save my profile',psaved:'Profile saved.',pfill:'Enter a name and an age between 18 and 99.',none:'No other members yet. You are among the first.',yrs:'years old',tMsg:'Messages',write:'Message',open:'Open',back:'Back',mSend:'Send',ph:'Your message…',you:'You',noConv:'No conversations yet. Write to a member from the Members tab.',rule:'For your safety: never share a phone number, a bank card or money.',blocked:'Message refused: sharing phone numbers, links, social apps (WhatsApp, etc.) or banking details is not allowed.',out:'Log out',
foot:'Adults only (18+). Your data stays private.'}};
function $(i){return document.getElementById(i)}
function fillC(id,idx){var list=L==='fr'?C:CE,el=$(id);el.textContent='';list.forEach(function(c,i){var o=document.createElement('option');o.value=C[i];o.textContent=c;el.appendChild(o)});el.selectedIndex=idx}
function pmsg(t,c){$('pmsg').textContent=t;$('pmsg').className='msg '+(c||'')}
function msg(t,c){$('msg').textContent=t;$('msg').className='msg '+(c||'')}
function render(){
  var d=T[L];document.documentElement.lang=L;
  $('t1').textContent=d.t1;$('t2').textContent=d.t2;
  $('tabUp').textContent=d.up;$('tabIn').textContent=d.inn;
  $('lName').textContent=d.name;$('lEmail').textContent=d.email;$('lPass').textContent=d.pass;
  $('lBirth').textContent=d.birth;$('lCountry').textContent=d.country;
  $('send').textContent=tab==='up'?d.sendUp:d.sendIn;
  $('logout').textContent=d.out;$('foot').textContent=d.foot;
  var cur=$('country').selectedIndex;if(cur<0)cur=0;
  fillC('country',cur);
  var cur2=$('pco').selectedIndex;if(cur2<0)cur2=0;fillC('pco',cur2);
  $('bfr').className=L==='fr'?'on':'';$('ben').className=L==='en'?'on':'';
  $('tabUp').className=tab==='up'?'on':'';$('tabIn').className=tab==='in'?'on':'';
  $('fName').className=tab==='up'?'':'hide';$('fUp').className=tab==='up'?'':'hide';
  $('pass').autocomplete=tab==='up'?'new-password':'current-password';
  var meta=user&&user.user_metadata||{};
  $('hello').textContent=d.hello+(meta.display_name?', '+meta.display_name:'')+' !';
  $('hsub').textContent=prof?'':d.complete;
  $('tabMem').textContent=d.tMem;$('tabMe').textContent=d.tMe;
  $('pName').textContent=d.pName;$('pAge').textContent=d.pAge;$('pCity').textContent=d.pCity;$('pCountry').textContent=d.pCountry;$('pBio').textContent=d.pBio;$('pSave').textContent=d.pSave;
  $('tabMem').className=homeTab==='mem'?'on':'';$('tabMe').className=homeTab==='me'?'on':'';
  $('secMe').className='card'+(homeTab==='me'?'':' hide');$('secMem').className=homeTab==='mem'?'':'hide';
  renderList();renderMsg();
  $('viewAuth').className=user?'hide':'';$('viewHome').className=user?'':'hide';
}
function renderList(){
  var d=T[L],box=$('list'),names=L==='fr'?C:CE;box.textContent='';
  if(!members.length){var p=document.createElement('p');p.className='sub';p.textContent=d.none;box.appendChild(p);return}
  members.forEach(function(m){
    var c=document.createElement('div');c.className='m';
    var b=document.createElement('b');b.textContent=m.display_name;c.appendChild(b);
    var i=C.indexOf(m.country),pl=[m.city,i>=0?names[i]:m.country].filter(Boolean).join(', ');
    var sp=document.createElement('span');sp.textContent=m.age+' '+d.yrs+(pl?' – '+pl:'');c.appendChild(sp);
    if(m.bio){var p=document.createElement('p');p.textContent=m.bio;c.appendChild(p)}
    var bt=document.createElement('button');bt.className='out';bt.textContent=d.write;bt.onclick=function(){openChat(m)};c.appendChild(bt);
    box.appendChild(c);
  });
}
function setHome(x){if((x==='mem'||x==='msg')&&!prof){render();return}homeTab=x;pmsg('');if(x==='msg'){loadConvs().then(render)}render()}
function fillForm(){
  var meta=user&&user.user_metadata||{};
  $('pn').value=prof?prof.display_name:(meta.display_name||'');
  $('pa').value=prof?prof.age:'';$('pc').value=prof&&prof.city?prof.city:'';$('pb').value=prof&&prof.bio?prof.bio:'';
  var co=prof?prof.country:meta.country,i=C.indexOf(co);if(i>=0)$('pco').selectedIndex=i;
}
async function loadMembers(){
  var r=await sb.from('profiles').select('id,display_name,age,city,country,bio').neq('id',user.id).order('updated_at',{ascending:false}).limit(50);
  members=r.data||[];
}
async function loadHome(){
  try{
    var r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
    prof=r.data||null;homeTab=prof?'mem':'me';fillForm();
    if(prof){await loadMembers();await loadConvs();subscribe()}
  }catch(e){}
  render();
}
async function saveP(){
  var d=T[L],n=$('pn').value.trim(),a=parseInt($('pa').value,10);
  if(!n||!(a>=18&&a<=99)){pmsg(d.pfill,'er');return}
  $('pSave').disabled=true;
  var row={id:user.id,display_name:n,age:a,city:$('pc').value.trim()||null,country:$('pco').value,bio:$('pb').value.trim()||null,updated_at:new Date().toISOString()};
  try{
    var r=await sb.from('profiles').upsert(row);
    if(r.error){pmsg(d.err,'er')}else{prof=row;pmsg(d.psaved,'ok');await loadMembers();subscribe();render()}
  }catch(e){pmsg(d.err,'er')}
  finally{$('pSave').disabled=false}
}
function blocked(t){
  var l=t.toLowerCase(),c=l.replace(/[^0-9a-z]/g,'');
  if(/[0-9]{8,}/.test(c))return true;
  if(/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/.test(l))return true;
  if(/https?:\/\/|www\.|\.(com|net|org|io)\b/.test(l))return true;
  if(/\b(whats?app|watsap|whatsap|telegram|viber|wechat|snapchat|snap|insta|skype|instagram|facebook|tiktok|iban|paypal|western union|orange money|mtn money|moov money|mobile money|carte bancaire|carte bleue|bitcoin|crypto|cvv)\b/.test(l))return true;
  if(/(whatsapp|whatsap|watsap|telegram|snapchat|instagram|facebook|tiktok|westernunion|orangemoney|paypal|bitcoin|wechat|viber)/.test(l.replace(/[^a-z]/g,'')))return true;
  return false;
}
function mmsg(t,c){$('mmsg').textContent=t;$('mmsg').className='msg '+(c||'')}
async function loadConvs(){
  try{
    var r=await sb.from('messages').select('sender_id,recipient_id,body,created_at').order('created_at',{ascending:false}).limit(200);
    var rows=r.data||[],seen={},ids=[],last={};
    rows.forEach(function(m){var o=m.sender_id===user.id?m.recipient_id:m.sender_id;if(!seen[o]){seen[o]=1;ids.push(o);last[o]=m}});
    var p=[];if(ids.length){p=(await sb.from('profiles').select('id,display_name').in('id',ids)).data||[]}
    var nm={};p.forEach(function(x){nm[x.id]=x.display_name});
    convs=ids.map(function(id){return {id:id,name:nm[id]||'?',body:last[id].body,mine:last[id].sender_id===user.id}});
  }catch(e){}
}
function renderMsg(){
  var d=T[L];
  $('tabMsg').textContent=d.tMsg;$('tabMsg').className=homeTab==='msg'?'on':'';
  $('secMsg').className=homeTab==='msg'?'':'hide';
  $('mSend').textContent=d.mSend;$('back').textContent=d.back;$('mb').placeholder=d.ph;$('rule').textContent=d.rule;
  $('chat').className=chatWith?'':'hide';$('convs').className=chatWith?'hide':'';
  if(chatWith)$('chatName').textContent=chatWith.name;
  var box=$('convs');box.textContent='';
  if(chatWith)return;
  if(!convs.length){var p=document.createElement('p');p.className='sub';p.textContent=d.noConv;box.appendChild(p)}
  convs.forEach(function(c){
    var el=document.createElement('div');el.className='m';
    var b=document.createElement('b');b.textContent=c.name;el.appendChild(b);
    var sp=document.createElement('span');sp.textContent=(c.mine?d.you+' : ':'')+c.body;el.appendChild(sp);
    var bt=document.createElement('button');bt.className='out';bt.textContent=d.open;bt.onclick=function(){openChat(c)};el.appendChild(bt);
    box.appendChild(el);
  });
}
function renderThread(){
  var box=$('thread');box.textContent='';
  thread.forEach(function(m){var el=document.createElement('div');el.className='bub '+(m.sender_id===user.id?'mine':'theirs');el.textContent=m.body;box.appendChild(el)});
  box.scrollTop=box.scrollHeight;
}
async function loadThread(){
  if(!chatWith)return;
  var a=user.id,b=chatWith.id;
  try{
    var r=await sb.from('messages').select('id,sender_id,body,created_at').or('and(sender_id.eq.'+a+',recipient_id.eq.'+b+'),and(sender_id.eq.'+b+',recipient_id.eq.'+a+')').order('created_at',{ascending:true}).limit(200);
    thread=r.data||[];renderThread();
  }catch(e){}
}
function openChat(p){chatWith={id:p.id,name:p.display_name||p.name};thread=[];homeTab='msg';mmsg('');render();loadThread()}
function closeChat(){chatWith=null;thread=[];render();loadConvs().then(render)}
async function sendM(){
  var d=T[L],t=$('mb').value.trim();
  if(!t||!chatWith)return;
  if(blocked(t)){mmsg(d.blocked,'er');return}
  $('mSend').disabled=true;
  try{
    var r=await sb.from('messages').insert({recipient_id:chatWith.id,body:t});
    if(r.error){mmsg(String(r.error.message).indexOf('contact_info_blocked')>=0?d.blocked:d.err,'er')}
    else{$('mb').value='';mmsg('');await loadThread()}
  }catch(e){mmsg(d.err,'er')}
  finally{$('mSend').disabled=false}
}
function subscribe(){
  if(!user)return;
  if(chan){sb.removeChannel(chan);chan=null}
  chan=sb.channel('inbox').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'recipient_id=eq.'+user.id},function(){
    if(chatWith)loadThread();
    loadConvs().then(render);
  }).subscribe();
}
function setL(x){L=x;render()}
function setTab(x){tab=x;msg('');render()}
function age(s){var b=new Date(s),n=new Date(),a=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a}
async function submitF(){
  var d=T[L],em=$('email').value.trim(),pw=$('pass').value;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)||pw.length<8){msg(d.fill,'er');return}
  $('send').disabled=true;msg('');
  try{
    if(tab==='up'){
      var nm=$('name').value.trim(),bd=$('birth').value;
      if(!nm||!bd){msg(d.fill,'er');return}
      if(isNaN(age(bd))||age(bd)<18){msg(d.young,'er');return}
      var r=await sb.auth.signUp({email:em,password:pw,options:{data:{display_name:nm,country:$('country').value,lang:L,over_18:true}}});
      if(r.error){msg(d.err,'er');return}
      if(r.data.session){return}
      msg(d.check,'ok');
    }else{
      var r2=await sb.auth.signInWithPassword({email:em,password:pw});
      if(r2.error){msg(d.badLogin,'er');return}
    }
  }catch(e){msg(d.err,'er')}
  finally{$('send').disabled=false}
}
async function logout(){await sb.auth.signOut()}
function setUser(u){user=u;var id=u?u.id:null;if(id!==lastId){lastId=id;prof=null;members=[];if(!u){if(chan){sb.removeChannel(chan);chan=null}chatWith=null;convs=[];thread=[]}if(u)loadHome()}render()}
sb.auth.onAuthStateChange(function(ev,session){setUser(session?session.user:null)});
sb.auth.getSession().then(function(r){setUser(r.data.session?r.data.session.user:null)});
render();
</script>
</body>
</html>
